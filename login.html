<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập | Video Admin Portal</title>
    <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="auth-page">
    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-header">
                <div class="auth-logo" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                </div>
                <h1 class="auth-title">Video Admin Portal</h1>
                <p class="auth-subtitle">Đăng nhập quản trị hệ thống (Supabase Cloud &amp; Auth)</p>
            </div>

            <div id="authAlert" class="auth-alert" role="alert"></div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="loginIdentifier" class="form-label">Email hoặc Username <span class="required">*</span></label>
                    <input
                        type="text"
                        id="loginIdentifier"
                        class="form-control"
                        placeholder="admin@vibecoding.dev hoặc admin"
                        autocomplete="username"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="loginPassword" class="form-label">Mật khẩu <span class="required">*</span></label>
                    <div class="input-with-action">
                        <input
                            type="password"
                            id="loginPassword"
                            class="form-control"
                            placeholder="Nhập mật khẩu của bạn"
                            autocomplete="current-password"
                            required
                        />
                        <button type="button" class="input-icon-btn toggle-password-btn" data-target="loginPassword" aria-label="Hiện mật khẩu">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="auth-row-between">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" checked />
                        <span>Duy trì đăng nhập</span>
                    </label>
                    <a href="forgot-password.html">Quên mật khẩu?</a>
                </div>

                <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-block">
                    Đăng nhập vào hệ thống
                </button>
            </form>

            <div class="auth-divider">Tài khoản mẫu (Supabase)</div>

            <div class="demo-accounts">
                <button type="button" class="demo-btn" data-username="admin@vibecoding.dev" data-password="123456">
                    Tài khoản ADMIN
                    <span>admin@vibecoding.dev / 123456</span>
                </button>
                <button type="button" class="demo-btn" data-username="user1@demo.com" data-password="123456">
                    Tài khoản USER mẫu
                    <span>user1@demo.com / 123456</span>
                </button>
            </div>

            <div class="auth-footer">
                Chưa có tài khoản quản trị? <a href="register.html">Đăng ký ngay</a>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/db-manager.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
