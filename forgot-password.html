<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quên mật khẩu | Video Admin Portal</title>
    <link rel="stylesheet" href="assets/css/style.css?v=3" />
</head>
<body class="auth-page">
    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-header">
                <div class="auth-logo" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <h1 class="auth-title">Đặt lại mật khẩu</h1>
                <p class="auth-subtitle">Nhập Email đã đăng ký để cập nhật mật khẩu mới trên <strong>Supabase</strong></p>
            </div>

            <div id="authAlert" class="auth-alert" role="alert"></div>

            <form id="forgotPasswordForm" novalidate>
                <div class="form-group">
                    <label for="resetEmail" class="form-label">Email đã đăng ký <span class="required">*</span></label>
                    <input
                        type="email"
                        id="resetEmail"
                        class="form-control"
                        placeholder="vd: admin@vibecoding.dev"
                        autocomplete="email"
                        required
                    />
                    <p class="form-hint">Gợi ý kiểm thử: user1@demo.com hoặc editor@vibecoding.dev</p>
                </div>

                <div class="form-group">
                    <label for="resetNewPassword" class="form-label">Mật khẩu mới <span class="required">*</span></label>
                    <div class="input-with-action">
                        <input
                            type="password"
                            id="resetNewPassword"
                            class="form-control"
                            placeholder="Tối thiểu 6 ký tự"
                            autocomplete="new-password"
                            required
                        />
                        <button type="button" class="input-icon-btn toggle-password-btn" data-target="resetNewPassword" aria-label="Hiện mật khẩu">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="resetConfirmPassword" class="form-label">Xác nhận mật khẩu mới <span class="required">*</span></label>
                    <div class="input-with-action">
                        <input
                            type="password"
                            id="resetConfirmPassword"
                            class="form-control"
                            placeholder="Nhập lại mật khẩu mới"
                            autocomplete="new-password"
                            required
                        />
                        <button type="button" class="input-icon-btn toggle-password-btn" data-target="resetConfirmPassword" aria-label="Hiện mật khẩu">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="forgotSubmitBtn" class="btn btn-primary btn-block">
                    Đặt lại mật khẩu mới
                </button>
            </form>

            <div class="auth-footer">
                Nhớ lại mật khẩu? <a href="login.html">Quay lại trang Đăng nhập</a>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/db-manager.js?v=3"></script>
    <script src="assets/js/auth.js?v=3"></script>
</body>
</html>
