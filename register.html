<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký tài khoản | Video Admin Portal</title>
    <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="auth-page">
    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-header">
                <div class="auth-logo" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <line x1="20" y1="8" x2="20" y2="14"></line>
                        <line x1="23" y1="11" x2="17" y2="11"></line>
                    </svg>
                </div>
                <h1 class="auth-title">Tạo tài khoản mới</h1>
                <p class="auth-subtitle">Đồng bộ trực tiếp lên <strong>Supabase PostgreSQL</strong></p>
            </div>

            <div id="authAlert" class="auth-alert" role="alert"></div>

            <form id="registerForm" novalidate>
                <div class="form-row-2">
                    <div class="form-group">
                        <label for="regUsername" class="form-label">Username <span class="required">*</span></label>
                        <input
                            type="text"
                            id="regUsername"
                            class="form-control"
                            placeholder="vd: vibe_admin"
                            autocomplete="username"
                            required
                        />
                    </div>
                    <div class="form-group">
                        <label for="regFullName" class="form-label">Họ và tên</label>
                        <input
                            type="text"
                            id="regFullName"
                            class="form-control"
                            placeholder="vd: Nguyễn Văn A"
                            autocomplete="name"
                        />
                    </div>
                </div>

                <div class="form-group">
                    <label for="regEmail" class="form-label">Địa chỉ Email <span class="required">*</span></label>
                    <input
                        type="email"
                        id="regEmail"
                        class="form-control"
                        placeholder="ban@vibecoding.dev"
                        autocomplete="email"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="regPassword" class="form-label">Mật khẩu <span class="required">*</span></label>
                    <div class="input-with-action">
                        <input
                            type="password"
                            id="regPassword"
                            class="form-control"
                            placeholder="Tối thiểu 6 ký tự"
                            autocomplete="new-password"
                            required
                        />
                        <button type="button" class="input-icon-btn toggle-password-btn" data-target="regPassword" aria-label="Hiện mật khẩu">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regConfirmPassword" class="form-label">Xác nhận mật khẩu <span class="required">*</span></label>
                    <div class="input-with-action">
                        <input
                            type="password"
                            id="regConfirmPassword"
                            class="form-control"
                            placeholder="Nhập lại mật khẩu"
                            autocomplete="new-password"
                            required
                        />
                        <button type="button" class="input-icon-btn toggle-password-btn" data-target="regConfirmPassword" aria-label="Hiện mật khẩu">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="registerSubmitBtn" class="btn btn-primary btn-block">
                    Đăng ký tài khoản
                </button>
            </form>

            <div class="auth-footer">
                Đã có tài khoản? <a href="login.html">Quay lại Đăng nhập</a>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/db-manager.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
